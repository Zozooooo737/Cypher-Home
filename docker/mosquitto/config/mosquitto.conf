# Configuration de Mosquitto pour Cypher Home (P2.2).

# Écoute sur le port 1883, sur toutes les adresses du conteneur.
# Pas de « listener 1883 127.0.0.1 » : dans le conteneur, 127.0.0.1 est le conteneur lui-même,
# et les connexions qui arrivent par le port publié de Docker ne seraient jamais reçues.
# La restriction « PC seulement » est faite dans docker-compose.yml.
listener 1883

# PROVISOIRE (étapes 1 à 3) : accepte les clients sans identifiant.
# À remplacer à l'étape 4 par l'authentification (allow_anonymous false + fichier de mots de passe).
allow_anonymous true
